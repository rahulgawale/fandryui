<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <!-- Per page: each route's "properties" in lwr.config.json
         (routeMeta.test.ts keeps them complete). -->
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <link rel="canonical" href="https://fandryui.forcetrails.com{{path}}" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fandry UI" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="https://fandryui.forcetrails.com{{path}}" />
    <meta property="og:image" content="https://fandryui.forcetrails.com{{image}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{imageAlt}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://fandryui.forcetrails.com{{image}}" />
    <meta name="twitter:image:alt" content="{{imageAlt}}" />

    <meta name="author" content="Rahul Gawale" />
    <meta name="application-name" content="Fandry UI" />
    <meta name="apple-mobile-web-app-title" content="Fandry UI" />
    <meta name="theme-color" content="#0d42f2" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/site.webmanifest" />
    <!-- The same on every page: the site, the library it documents, and its
         author, for search engines and AI answers. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://fandryui.forcetrails.com/#website",
            "name": "Fandry UI",
            "url": "https://fandryui.forcetrails.com/",
            "description": "A composable, themeable UI component library for Salesforce LWC.",
            "about": { "@id": "https://fandryui.forcetrails.com/#library" },
            "publisher": { "@id": "https://fandryui.forcetrails.com/#author" }
          },
          {
            "@type": "SoftwareSourceCode",
            "@id": "https://fandryui.forcetrails.com/#library",
            "name": "Fandry UI",
            "alternateName": "fandryui",
            "description": "A modern, composable UI component library for Salesforce Lightning Web Components (LWC), LWR, Experience Cloud and LWC OSS: themeable with design tokens, extensible with slots, CSS parts and state classes, shipped as plain LWC source.",
            "url": "https://fandryui.forcetrails.com/",
            "codeRepository": "https://github.com/rahulgawale/fandryui",
            "programmingLanguage": ["JavaScript", "TypeScript", "HTML", "CSS"],
            "runtimePlatform": ["Salesforce Lightning Web Components", "LWR", "LWC OSS"],
            "license": "https://opensource.org/licenses/MIT",
            "keywords": "Salesforce, LWC, Lightning Web Components, LWR, Experience Cloud, UI components, design system, design tokens",
            "sameAs": ["https://www.npmjs.com/package/fandryui", "https://github.com/rahulgawale/fandryui"],
            "author": { "@id": "https://fandryui.forcetrails.com/#author" }
          },
          {
            "@type": "Person",
            "@id": "https://fandryui.forcetrails.com/#author",
            "name": "Rahul Gawale",
            "url": "https://github.com/rahulgawale",
            "sameAs": ["https://www.youtube.com/@forcetrails"]
          }
        ]
      }
    </script>
    <!-- Google Analytics 4; async, so it never blocks rendering. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-18F150Z1JV"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-18F150Z1JV');
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- One request for all three families. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Geist+Mono:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/assets/styles/global.css" />
    <!-- The plain-HTML copy scripts/prerender.mjs writes for crawlers; the
         app renders the real page. -->
    <style>
      @media (scripting: enabled) {
        .prerender {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- A div, not <main>: every page renders its own <main> landmark, and a
         document should have exactly one. -->
    <div class="wrapper">
      <div id="main">{{{body}}}</div>
    </div>
    {{{lwr_resources}}}
  </body>
</html>
