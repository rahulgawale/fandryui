<template>
  <div class="form-control" part="base">
    <label id="label" class="label" part="label" for="trigger" hidden={labelHidden} onclick={handleLabelClick}>
      <slot name="label" onslotchange={handleTextSlotChange}>{label}</slot>
      <template if:true={required}>
        <span class="required" part="required" aria-hidden="true">*</span>
      </template>
    </label>

    <fandry-popover class="control" exportparts="panel" open={open} ontoggle={handleToggle}>
      <button
        slot="trigger"
        id="trigger"
        type="button"
        class="trigger"
        part={controlPart}
        disabled={disabled}
        data-name={name}
        role="combobox"
        aria-haspopup="listbox"
        aria-expanded={ariaExpanded}
        aria-controls="listbox"
        aria-activedescendant={activeOptionId}
        aria-describedby={describedBy}
        aria-invalid={ariaInvalid}
        aria-required={ariaRequired}
        onkeydown={handleTriggerKeydown}
        onkeyup={handleTriggerKeyup}
        onblur={handleTriggerBlur}
        lwc:spread={resolvedElementProps}
      >
        <span class={valueClasses} part="value">{summary}</span>
        <span class="chevron" part="chevron" aria-hidden="true"></span>
      </button>

      <div id="listbox" class="listbox" part="listbox" role="listbox" aria-multiselectable="true" aria-labelledby="label" onmousedown={handleListboxMouseDown} onmousemove={handleListboxMouseMove}>
        <template for:each={renderOptions} for:item="option">
          <div
            key={option.id}
            id={option.id}
            class={option.classes}
            part={option.part}
            role="option"
            data-option-id={option.id}
            aria-selected={option.ariaSelected}
            aria-disabled={option.ariaDisabled}
            onclick={handleOptionClick}
          >
            <span class="box" part={option.indicatorPart} aria-hidden="true"><span class="check"></span></span>
            <span class="option-label" part="option-label">{option.label}</span>
          </div>
        </template>
      </div>
    </fandry-popover>

    <div id="error-text" class={errorTextClasses} part="error-text" aria-live="polite">
      <slot name="error-text" onslotchange={handleTextSlotChange}>{errorText}</slot>
    </div>

    <div id="help-text" class="help-text" part="help-text" hidden={helpTextHidden}>
      <slot name="help-text" onslotchange={handleTextSlotChange}>{helpText}</slot>
    </div>
  </div>
</template>
