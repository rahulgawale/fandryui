<template>
  <nav class="pagination" part="base" aria-label="Pagination">
    <template if:true={hasPrevious}>
      <a class="link link--previous" part="link previous" href={previousHref}>
        <span class="eyebrow" part="eyebrow">← Previous</span>
        <span class="title" part="title">{previousLabel}</span>
      </a>
    </template>
    <template if:false={hasPrevious}>
      <span class="spacer"></span>
    </template>

    <template if:true={hasNext}>
      <a class="link link--next" part="link next" href={nextHref}>
        <span class="eyebrow" part="eyebrow">Next →</span>
        <span class="title" part="title">{nextLabel}</span>
      </a>
    </template>
    <template if:false={hasNext}>
      <span class="spacer"></span>
    </template>
  </nav>
</template>
