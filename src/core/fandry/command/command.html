<template>
  <template if:true={isMounted}>
    <!--
      A native modal dialog (see showModal in command.ts): the browser makes
      the rest of the page inert, for a screen reader's own cursor as well as
      for Tab. Not role="dialog" with aria-modal: in a shadow root that hides
      the palette itself from VoiceOver in Safari, along with the page.
    -->
    <dialog
      class={backdropClasses}
      part="backdrop"
      aria-label={accessibleLabel}
      inert={backdropInert}
      onclick={handleBackdropClick}
      oncancel={handleCancel}
    >
      <div class="panel" part="panel" onmousedown={handlePanelMouseDown}>
        <div class="search" part="search">
          <input
            id="input"
            class="input"
            part="input"
            type="text"
            autocomplete="off"
            value={query}
            placeholder={placeholder}
            role="combobox"
            aria-label={accessibleLabel}
            aria-autocomplete="list"
            aria-expanded="true"
            aria-controls="listbox"
            aria-activedescendant={activeDescendant}
            oninput={handleInput}
            onkeydown={handleInputKeydown}
          />
        </div>

        <div id="listbox" class="listbox" part="listbox" role="listbox" aria-label={accessibleLabel} onmousedown={handleListboxMouseDown}>
          <template for:each={renderGroups} for:item="group">
            <div key={group.key} class="group" part="group" role="group" aria-label={group.label}>
              <template if:true={group.hasLabel}>
                <div class="group-label" part="group-label" aria-hidden="true">{group.label}</div>
              </template>
              <template for:each={group.options} for:item="option">
                <div
                  key={option.id}
                  id={option.id}
                  class={option.classes}
                  part={option.part}
                  role="option"
                  data-option-id={option.id}
                  aria-selected={option.ariaSelected}
                  aria-disabled={option.ariaDisabled}
                  onclick={handleOptionClick}
                  onmousemove={handleOptionMouseMove}
                >
                  <template if:true={option.component}>
                    <lwc:component lwc:is={option.component} lwc:spread={option.resolvedComponentProps}></lwc:component>
                  </template>
                  <template if:false={option.component}>
                    <span class="option-label" part="option-label">{option.label}</span>
                    <template if:true={option.hasDescription}>
                      <span class="option-description" part="option-description">{option.description}</span>
                    </template>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </div>

        <!--
          Always here, so what it says is announced as it changes: how many
          results there are (for a screen reader only), or the empty message.
        -->
        <div class="status" role="status">
          <template if:true={hasResults}>
            <span class="count">{resultsText}</span>
          </template>
          <template if:false={hasResults}>
            <div class="empty" part="empty"><slot name="empty">No results found</slot></div>
          </template>
        </div>
      </div>
    </dialog>
  </template>
</template>
