<template>
  <div class="form-control" part="base">
    <label class="label" part="label" for="trigger" hidden={labelHidden}>
        <slot name="label" onslotchange={handleTextSlotChange}>
          {label}
          <template if:true={required}>
            <span class="required" part="required" aria-hidden="true">*</span>
          </template>
        </slot>
      </label>

    <fandry-popover class="control" exportparts="panel" open={open} ontoggle={handleToggle}>
      <button
        slot="trigger"
        id="trigger"
        type="button"
        class="trigger"
        part={controlPart}
        disabled={disabled}
        data-name={name}
        role="combobox"
        aria-haspopup="listbox"
        aria-expanded={ariaExpanded}
        aria-controls="listbox"
        aria-activedescendant={activeOptionId}
        aria-describedby="help-text"
        aria-required={ariaRequired}
        onkeydown={handleTriggerKeydown}
        lwc:spread={resolvedElementProps}
      >
        <span class={valueClasses} part="value">
          <template if:true={selectedComponent}>
            <lwc:component lwc:is={selectedComponent} lwc:spread={selectedComponentProps}></lwc:component>
          </template>
          <template if:false={selectedComponent}>{selectedLabel}</template>
        </span>
        <span class="chevron" part="chevron" aria-hidden="true"></span>
      </button>

      <div id="listbox" class="listbox" part="listbox" role="listbox" onmousedown={handleListboxMouseDown}>
        <template if:true={renderPlaceholder}>
          <div
            id={renderPlaceholder.id}
            class={renderPlaceholder.classes}
            part={renderPlaceholder.part}
            role="option"
            data-value={renderPlaceholder.value}
            data-option-id={renderPlaceholder.id}
            aria-selected={renderPlaceholder.ariaSelected}
            aria-disabled={renderPlaceholder.ariaDisabled}
          >{renderPlaceholder.label}</div>
        </template>

        <template for:each={renderOptions} for:item="option">
          <div
            key={option.id}
            id={option.id}
            class={option.classes}
            part={option.part}
            role="option"
            data-value={option.value}
            data-option-id={option.id}
            aria-selected={option.ariaSelected}
            aria-disabled={option.ariaDisabled}
            onclick={handleOptionClick}
            onmouseenter={handleOptionMouseEnter}
          ><template if:true={option.component}><lwc:component lwc:is={option.component} lwc:spread={option.resolvedComponentProps}></lwc:component></template><template if:false={option.component}>{option.label}</template></div>
        </template>

        <template for:each={renderGroups} for:item="group">
          <div key={group.label} class="group" part="group" role="group" aria-label={group.label}>
            <div class="group-label" part="group-label" aria-hidden="true">{group.label}</div>
            <template for:each={group.options} for:item="option">
              <div
                key={option.id}
                id={option.id}
                class={option.classes}
                part={option.part}
                role="option"
                data-value={option.value}
                data-option-id={option.id}
                aria-selected={option.ariaSelected}
                aria-disabled={option.ariaDisabled}
                onclick={handleOptionClick}
                onmouseenter={handleOptionMouseEnter}
              ><template if:true={option.component}><lwc:component lwc:is={option.component} lwc:spread={option.resolvedComponentProps}></lwc:component></template><template if:false={option.component}>{option.label}</template></div>
            </template>
          </div>
        </template>
      </div>
    </fandry-popover>

    <div id="help-text" class="help-text" part="help-text" hidden={helpTextHidden}>
      <slot name="help-text" onslotchange={handleTextSlotChange}>{helpText}</slot>
    </div>
  </div>
</template>
