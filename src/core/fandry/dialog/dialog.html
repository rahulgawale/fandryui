<template>
  <template if:true={isMounted}>
    <!--
      A native modal <dialog>: the browser makes the rest of the page inert,
      so Tab can't leave it, and draws it in the top layer. It is the
      full-screen backdrop; the panel is the box inside it.
    -->
    <dialog class={backdropClasses} part="backdrop" aria-label={accessibleLabel} inert={backdropInert} onclick={handleBackdropClick} oncancel={handleCancel} onclose={handleNativeClose}>
      <div class="panel" part="panel" tabindex="-1">
        <slot></slot>
      </div>
    </dialog>
  </template>
</template>
