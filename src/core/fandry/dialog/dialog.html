<template>
  <template if:true={isMounted}>
    <div class={backdropClasses} part="backdrop" inert={backdropInert} onclick={handleBackdropClick}>
      <div class="panel" part="panel" role="dialog" aria-modal="true" aria-label={label} tabindex="-1">
        <slot></slot>
      </div>
    </div>
  </template>
</template>
