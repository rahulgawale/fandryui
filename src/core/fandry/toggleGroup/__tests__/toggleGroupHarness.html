<template>
  <fandry-toggle-group value={value} multiple={multiple} aria-label="Format" onchange={handleChange}>
    <fandry-toggle-button value="bold">Bold</fandry-toggle-button>
    <fandry-toggle-button value="italic" disabled={italicDisabled}>Italic</fandry-toggle-button>
    <fandry-toggle-button value="underline">Underline</fandry-toggle-button>
  </fandry-toggle-group>
</template>
