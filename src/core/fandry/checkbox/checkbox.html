<template>
  <label class="control" part="base" aria-disabled={disabled}>
    <input
      class="input"
      type="checkbox"
      name={name}
      value={value}
      checked={checked}
      disabled={disabled}
      required={required}
      aria-describedby={describedBy}
      aria-invalid={ariaInvalid}
      aria-checked={ariaChecked}
      aria-label={ariaLabel}
      onchange={handleChange}
      onblur={handleBlur}
      lwc:spread={resolvedElementProps}
    />

    <span class="box" part={controlPart} aria-hidden="true">
      <span class="check" part="indicator"></span>
    </span>

    <span class="label" part="label" hidden={labelHidden}><slot onslotchange={handleTextSlotChange}>{label}</slot></span>
  </label>

  <div id="error-text" class={errorTextClasses} part="error-text" aria-live="polite">
    <slot name="error-text" onslotchange={handleTextSlotChange}>{shownErrorText}</slot>
  </div>
</template>
