<template>
  <fandry-table
    columns={columns}
    data={data}
    enable-global-filter={enableGlobalFilter}
    enable-row-selection={enableRowSelection}
    enable-pagination={enablePagination}
    page-size={pageSize}
    global-filter-debounce-ms={globalFilterDebounceMs}
  >
    <input class="custom-search" slot="search" />
    <input class="custom-select-all" type="checkbox" slot="selection-all" />
    <fandry-pagination slot="pagination" page-index={customPageIndex} page-count={customPageCount}>
      <button class="custom-next" type="button" slot="next">Next</button>
    </fandry-pagination>
  </fandry-table>
</template>
