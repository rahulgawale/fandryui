<template>
  <template if:true={enableGlobalFilter}>
    <!--
      `oninput` is delegated onto the wrapper rather than bound to fandry-input
      directly, so a consumer can replace the default search box entirely
      via slot="search" -- anything projected there just needs to dispatch
      a bubbling "input" event with the search string as `.detail`, the
      same contract fandry-input already fulfills.
    -->
    <div class="table-toolbar" part="toolbar" oninput={handleGlobalFilterInput}>
      <slot name="search">
        <fandry-input
          placeholder={globalFilterPlaceholder}
          value={globalFilter}
          size="sm"
        ></fandry-input>
      </slot>
    </div>
  </template>
  <div class="table-wrapper" part="container">
    <table class={tableClasses} part="table" aria-busy={loading}>
      <template if:true={hasCaption}>
        <caption class="caption" part="caption">{caption}</caption>
      </template>
      <thead>
        <!--
          A single, un-iterated <tr> -- fandry-table has no column-grouping
          feature, so `headerGroups` always has exactly one entry, and a
          named <slot> (below) isn't allowed to appear inside a `for:each`
          iterator, so this can't be written as a for:each over headerGroups.
        -->
        <tr part="header-row">
          <template if:true={enableRowSelection}>
            <!--
              `onchange` delegated onto the <th> (see the search toolbar
              comment above for why) -- slot="selection-all" to replace
              the default "select all" control.
            -->
            <th class="selection-cell" part="header-cell selection-cell" scope="col" onchange={handleToggleAllRowsSelected}>
              <template if:true={enableMultiRowSelection}>
                <slot name="selection-all">
                  <fandry-checkbox
                    class="selection-header-checkbox"
                    checked={allRowsSelected}
                    indeterminate={someRowsSelected}
                    aria-label="Select all rows"
                  ></fandry-checkbox>
                </slot>
              </template>
            </th>
          </template>
          <template for:each={headerGroup.headers} for:item="header">
            <th key={header.id} part="header-cell" scope="col" aria-sort={header.ariaSort}>
              <template if:true={header.canSort}>
                <button
                  type="button"
                  class="sort-button"
                  part="sort-button"
                  data-column-id={header.columnId}
                  onclick={handleHeaderClick}
                  lwc:spread={resolvedSortButtonProps}
                >
                  <span class="header-label" part="header-label">{header.label}</span>
                  <span class="sort-indicator" part="sort-indicator" aria-hidden="true">{header.sortIndicator}</span>
                </button>
              </template>
              <template if:false={header.canSort}>
                <span class="header-label" part="header-label">{header.label}</span>
              </template>
            </th>
          </template>
        </tr>
      </thead>
      <tbody>
        <template if:true={loading}>
          <template for:each={loadingRows} for:item="loadingRow">
            <tr key={loadingRow} class="loading-row" part="row loading-row" aria-hidden="true">
              <template if:true={enableRowSelection}>
                <td class="selection-cell" part="cell selection-cell">
                  <fandry-skeleton variant="circle"></fandry-skeleton>
                </td>
              </template>
              <template for:each={loadingCells} for:item="loadingCell">
                <td key={loadingCell} part="cell">
                  <fandry-skeleton variant="text"></fandry-skeleton>
                </td>
              </template>
            </tr>
          </template>
        </template>
        <template if:false={loading}>
          <template if:true={hasRows}>
            <template for:each={rows} for:item="row">
              <tr key={row.id} part="row" data-row-id={row.id} onclick={handleRowClick}>
                <template if:true={enableRowSelection}>
                  <td class="selection-cell" part="cell selection-cell" onclick={handleSelectionCellClick}>
                    <fandry-checkbox
                      checked={row.selected}
                      data-row-id={row.id}
                      aria-label={row.selectionAriaLabel}
                      onchange={handleToggleRowSelected}
                    ></fandry-checkbox>
                  </td>
                </template>
                <template for:each={row.cells} for:item="cell">
                  <td key={cell.id} part="cell">{cell.value}</td>
                </template>
              </tr>
            </template>
          </template>
          <template if:false={hasRows}>
            <tr class="empty-row" part="row empty-row">
              <td class="empty-cell" part="cell empty" colspan={columnCount}>
                <slot name="empty">No data</slot>
              </td>
            </tr>
          </template>
        </template>
      </tbody>
    </table>
  </div>
  <template if:true={hasFooter}>
    <div class="table-footer" part="footer">
      <span class="selection-status" part="selection-status">{selectionStatus}</span>
      <template if:true={enablePagination}>
        <!--
          `onchange` is delegated onto the wrapper (see the search toolbar
          comment above for why) -- slot="pagination" to replace the default
          fandry-pagination entirely, e.g. with your own fandry-pagination
          using its previous/status/next slots. Anything projected there
          just needs to dispatch a bubbling "change" event with the target
          page as `detail.pageIndex`, the same contract fandry-pagination
          already fulfills; read the current page state via `pagechange` or
          getTanstackTable().
        -->
        <div class="pagination" part="pagination" onchange={handlePageChange}>
          <slot name="pagination">
            <fandry-pagination page-index={pageIndex} page-count={totalPages}></fandry-pagination>
          </slot>
        </div>
      </template>
    </div>
  </template>
</template>
