<template>
  <div class="form-control" part="base">
    <label class="label" part="label" for="textarea" hidden={labelHidden}>
      <slot name="label" onslotchange={handleTextSlotChange}>{label}</slot>
      <template if:true={required}>
        <span class="required" part="required" aria-hidden="true">*</span>
      </template>
    </label>

    <textarea
      class="textarea"
      part={controlPart}
      id="textarea"
      name={name}
      placeholder={placeholder}
      rows={rows}
      disabled={disabled}
      readonly={readonly}
      required={required}
      aria-describedby={describedBy}
      data-value={value}
      oninput={handleInput}
      onchange={handleChange}
      lwc:spread={resolvedElementProps}
    ></textarea>

    <div id="help-text" class="help-text" part="help-text" hidden={helpTextHidden}>
      <slot name="help-text" onslotchange={handleTextSlotChange}>{helpText}</slot>
    </div>
  </div>
</template>
