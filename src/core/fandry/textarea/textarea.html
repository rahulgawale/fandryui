<template>
  <div class="form-control" part="base">
    <fandry-label exportparts="base: label, required" html-for="textarea" required={required} hidden={labelHidden}>
      <slot name="label" onslotchange={handleTextSlotChange}>{label}</slot>
    </fandry-label>

    <textarea
      class="textarea"
      part={controlPart}
      id="textarea"
      name={name}
      placeholder={placeholder}
      rows={rows}
      disabled={disabled}
      readonly={readonly}
      required={required}
      aria-describedby="help-text"
      data-value={value}
      oninput={handleInput}
      onchange={handleChange}
      lwc:spread={resolvedElementProps}
    ></textarea>

    <div id="help-text" class="help-text" part="help-text" hidden={helpTextHidden}>
      <slot name="help-text" onslotchange={handleTextSlotChange}>{helpText}</slot>
    </div>
  </div>
</template>
