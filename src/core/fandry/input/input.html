<template>
  <div class="form-control" part="base">
    <fandry-label exportparts="base: label, required" html-for="input" required={required} hidden={labelHidden}>
      <slot name="label" onslotchange={handleTextSlotChange}>{label}</slot>
    </fandry-label>

    <div class={controlClasses} part={controlPart}>
      <span class="prefix" part="prefix">
        <slot name="prefix"></slot>
      </span>

      <input
        class="input"
        part="input"
        id="input"
        type={type}
        name={name}
        value={value}
        placeholder={placeholder}
        disabled={disabled}
        readonly={readonly}
        required={required}
        aria-describedby="help-text"
        oninput={handleInput}
        onchange={handleChange}
        onfocus={handleFocus}
        onblur={handleBlur}
        lwc:spread={resolvedElementProps}
      />

      <span class="suffix" part="suffix">
        <slot name="suffix"></slot>
      </span>
    </div>

    <div id="help-text" class="help-text" part="help-text" hidden={helpTextHidden}>
      <slot name="help-text" onslotchange={handleTextSlotChange}>{helpText}</slot>
    </div>
  </div>
</template>
