<template>
  <div class="form-control" part="base">
    <template if:true={hasLabel}>
      <fandry-label exportparts="base: label, required" html-for="input" required={required}> {label} </fandry-label>
    </template>

    <div class={controlClasses} part={controlPart}>
      <span class="prefix" part="prefix">
        <slot name="prefix"></slot>
      </span>

      <input
        class="input"
        part="input"
        id="input"
        type={type}
        name={name}
        value={value}
        placeholder={placeholder}
        disabled={disabled}
        readonly={readonly}
        required={required}
        aria-describedby="help-text"
        oninput={handleInput}
        onchange={handleChange}
        onfocus={handleFocus}
        onblur={handleBlur}
        lwc:spread={resolvedElementProps}
      />

      <span class="suffix" part="suffix">
        <slot name="suffix"></slot>
      </span>
    </div>

    <template if:true={hasHelpText}>
      <div id="help-text" class="help-text" part="help-text">{helpText}</div>
    </template>
  </div>
</template>
