<template>
  <div class="form-control" part="base">
    <span class="label" part="label" id="radio-group-label" hidden={labelHidden}>
      <slot name="label" onslotchange={handleTextSlotChange}>{label}</slot>
    </span>
    <div class="radio-group" part="list" role="radiogroup" aria-labelledby={labelledBy} aria-label={ariaLabel}>
      <slot onslotchange={handleSlotChange}></slot>
    </div>
  </div>
</template>
