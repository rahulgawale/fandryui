<template>
  <!-- Every native <button> here carries tabindex="0": macOS Safari skips
       buttons in the Tab order (and won't keep programmatic focus on them)
       unless they have one -- see fandry-button. -->
  <div class="form-control" part="base">
    <template if:true={hasLabel}>
      <label id="label" class="label" part="label" for="input">
        <slot name="label">
          {label}
          <template if:true={required}>
            <span class="required" part="required" aria-hidden="true">*</span>
          </template>
        </slot>
      </label>
    </template>

    <div class="control">
      <div class="field" part={controlPart} onmousedown={handleFieldMouseDown} onclick={handleFieldClick}>
        <template if:true={showSelected}>
          <div class="selected" part="selected" role="group" aria-labelledby="label">
            <span class={selectedLabelClasses} part="selected-label">{selectedLabel}</span>
            <button
              type="button"
              class="clear"
              part="clear-button"
              tabindex="0"
              aria-label={clearLabel}
              disabled={disabled}
              onclick={handleClear}
            >
              <svg class="icon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                <path d="M2.5 2.5l7 7M9.5 2.5l-7 7"></path>
              </svg>
            </button>
          </div>
        </template>

        <template if:true={showInput}>
          <div class="tokens" part="chips">
            <template for:each={chips} for:item="chip">
              <span key={chip.id} class="pill" part="chip">
                <span class={chip.labelClasses} part="chip-label">{chip.label}</span>
                <button
                  type="button"
                  class="pill-remove"
                  part="chip-remove"
                  tabindex="0"
                  data-record-id={chip.id}
                  aria-label={chip.removeLabel}
                  disabled={disabled}
                  onclick={handleRemove}
                >
                  <svg class="icon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                    <path d="M2.5 2.5l7 7M9.5 2.5l-7 7"></path>
                  </svg>
                </button>
              </span>
            </template>

            <input
              id="input"
              class="input"
              part="input"
              type="text"
              autocomplete="off"
              data-name={name}
              value={query}
              placeholder={placeholder}
              disabled={disabled}
              role="combobox"
              aria-autocomplete="list"
              aria-haspopup="listbox"
              aria-expanded={ariaExpanded}
              aria-controls="listbox"
              aria-activedescendant={openActiveDescendant}
              aria-describedby="help-text"
              aria-required={ariaRequired}
              oninput={handleInput}
              onclick={handleInputClick}
              onblur={handleInputBlur}
              onkeydown={handleInputKeydown}
              lwc:spread={resolvedElementProps}
            />
          </div>

          <template if:true={hasChips}>
            <button type="button" class="clear-all" part="clear-all" tabindex="0" disabled={disabled} onclick={handleClearAll}><slot name="clear-all">Clear all</slot></button>
          </template>
        </template>
      </div>

      <template if:true={showPanel}>
        <div class={panelClasses} part="panel" inert={panelInert} onmousedown={handleListboxMouseDown}>
          <div
            id="listbox"
            class="listbox"
            part="listbox"
            role="listbox"
            aria-busy={ariaBusy}
            aria-multiselectable={ariaMultiselectable}
          >
            <template for:each={renderGroups} for:item="group">
              <div key={group.key} class="group" part="group" role="group" aria-label={group.label}>
                <template if:true={group.hasLabel}>
                  <div class="group-label" part="group-label" aria-hidden="true">{group.label}</div>
                </template>
                <template for:each={group.options} for:item="option">
                  <div
                    key={option.id}
                    id={option.id}
                    class={option.classes}
                    part={option.part}
                    role="option"
                    data-option-id={option.id}
                    aria-selected={option.ariaSelected}
                    aria-disabled={option.ariaDisabled}
                    onclick={handleOptionClick}
                    onmousemove={handleOptionMouseMove}
                  >
                    <template if:true={option.component}>
                      <lwc:component lwc:is={option.component} lwc:spread={option.resolvedComponentProps}></lwc:component>
                    </template>
                    <template if:false={option.component}>
                      <span class="option-label" part="option-label">{option.label}</span>
                      <template if:true={option.hasDescription}>
                        <span class="option-description" part="option-description">{option.description}</span>
                      </template>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </div>

          <!-- Below the results, not above: inserting it above would push the
               (stale) list down every time a search starts. -->
          <template if:true={searching}>
            <div class="status" part="status">
              <fandry-spinner size="sm" label={searchingLabel}></fandry-spinner>
              <span aria-hidden="true"><slot name="searching">Searching…</slot></span>
            </div>
          </template>

          <template if:true={showEmpty}>
            <div class="empty" part="empty"><slot name="empty">No records found</slot></div>
          </template>
        </div>
      </template>
    </div>

    <template if:true={hasHelpText}>
      <div id="help-text" class="help-text" part="help-text">{helpText}</div>
    </template>
  </div>
</template>
