<template>
  <div class="form">
    <div class="fields">
      <template for:each={renderFields} for:item="item">
        <fandry-form-field
          key={item.name}
          data-name={item.name}
          exportparts="base: field, changed, revert"
          field={item.field}
          value={item.value}
          error={item.error}
          changed={item.changed}
          mode={mode}
          disabled={saving}
          messages={fieldMessages}
          onchange={handleFieldChange}
          onblur={handleFieldBlur}
          onsubmit={handleFieldSubmit}
          onrevert={handleFieldRevert}
        ></fandry-form-field>
      </template>
    </div>

    <template if:true={hasStatus}>
      <fandry-alert variant={statusVariant}>{statusMessage}</fandry-alert>
    </template>

    <!--
      Replaces the default buttons. A button you put here reaches the form
      through its methods: form.edit(), form.save(), form.cancel(), form.reset().
    -->
    <div class="actions">
      <slot name="actions">
        <template if:true={isReading}>
          <fandry-button variant="secondary" data-action="edit" onclick={handleEdit}>{text.edit}</fandry-button>
        </template>
        <template if:true={isEditing}>
          <fandry-button element-props={saveButtonProps} onclick={handleSave}>
            <template if:true={saving}>
              <fandry-spinner size="sm" aria-hidden="true"></fandry-spinner>
            </template>
            {saveLabel}
          </fandry-button>
          <fandry-button variant="secondary" disabled={saving} onclick={handleCancel}>{text.cancel}</fandry-button>
          <fandry-button variant="ghost" data-action="reset" element-props={resetButtonProps} onclick={handleReset}>{text.reset}</fandry-button>
        </template>
      </slot>
    </div>
  </div>
</template>
