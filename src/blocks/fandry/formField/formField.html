<template>
  <template if:true={hasField}>
    <div class={fieldClasses} part={basePart} onkeydown={handleKeydown} onfocusout={handleFocusOut}>
      <template if:true={isReadOnly}>
        <div class="read">
          <fandry-text as="span" size="sm" variant="muted" class="read-label">{field.label}</fandry-text>
          <fandry-text as="div" class="read-value">{readText}</fandry-text>
        </div>
      </template>

      <template if:false={isReadOnly}>
        <template if:true={isInput}>
          <fandry-input
            class="control"
            type={inputType}
            name={field.name}
            label={field.label}
            help-text={field.helpText}
            error-text={error}
            placeholder={field.placeholder}
            required={field.required}
            disabled={disabled}
            value={stringValue}
            element-props={controlProps}
            oninput={handleControlChange}
            onchange={handleControlChange}
          ></fandry-input>
        </template>
        <template if:true={isTextarea}>
          <fandry-textarea
            class="control"
            name={field.name}
            label={field.label}
            help-text={field.helpText}
            error-text={error}
            placeholder={field.placeholder}
            required={field.required}
            disabled={disabled}
            value={stringValue}
            element-props={controlProps}
            oninput={handleControlChange}
            onchange={handleControlChange}
          ></fandry-textarea>
        </template>
        <template if:true={isSelect}>
          <fandry-select
            class="control"
            name={field.name}
            label={field.label}
            help-text={field.helpText}
            error-text={error}
            placeholder={field.placeholder}
            required={field.required}
            disabled={disabled}
            value={stringValue}
            options={options}
            element-props={controlProps}
            onchange={handleControlChange}
          ></fandry-select>
        </template>
        <template if:true={isRadio}>
          <fandry-radio-group
            class="control"
            name={field.name}
            label={field.label}
            value={stringValue}
            onchange={handleControlChange}
          >
            <template for:each={radioOptions} for:item="option">
              <fandry-radio
                key={option.value}
                name={field.name}
                label={option.label}
                value={option.value}
                checked={option.checked}
                disabled={disabled}
              ></fandry-radio>
            </template>
          </fandry-radio-group>
        </template>
        <template if:true={isCheckboxes}>
          <fieldset class="control group" part="list" aria-describedby={groupDescribedBy}>
            <legend class="legend" part="label">{field.label}<template if:true={requiredMark}><span class="required" aria-hidden="true"> *</span></template></legend>
            <template for:each={checkboxOptions} for:item="option">
              <fandry-checkbox
                key={option.value}
                name={field.name}
                label={option.label}
                value={option.value}
                data-value={option.value}
                checked={option.checked}
                disabled={disabled}
                element-props={controlProps}
                onchange={handleCheckboxChange}
              ></fandry-checkbox>
            </template>
          </fieldset>
        </template>
        <template if:true={isMultiSelect}>
          <fandry-multi-select
            class="control"
            name={field.name}
            label={field.label}
            help-text={field.helpText}
            error-text={error}
            placeholder={field.placeholder}
            required={field.required}
            disabled={disabled}
            value={listValue}
            options={options}
            element-props={controlProps}
            onchange={handleControlChange}
          ></fandry-multi-select>
        </template>
        <template if:true={isCheckbox}>
          <fandry-checkbox
            class="control"
            name={field.name}
            label={field.label}
            disabled={disabled}
            checked={checked}
            element-props={controlProps}
            onchange={handleControlChange}
          ></fandry-checkbox>
        </template>
        <template if:true={isSwitch}>
          <fandry-switch
            class="control"
            name={field.name}
            label={field.label}
            disabled={disabled}
            checked={checked}
            element-props={controlProps}
            onchange={handleControlChange}
          ></fandry-switch>
        </template>

        <template if:true={showChanged}>
          <fandry-button
            class="revert"
            exportparts="base: revert"
            variant="ghost"
            size="sm"
            disabled={disabled}
            element-props={revertButtonProps}
            onclick={handleRevert}
          >
            <fandry-icon size="sm">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"
                ></path>
              </svg>
            </fandry-icon>
          </fandry-button>
        </template>

        <template if:true={showOwnHelpText}>
          <p id="help-text" class="help">{field.helpText}</p>
        </template>
        <template if:true={showOwnError}>
          <p id="error-text" class="error" role="alert">{error}</p>
        </template>
      </template>
    </div>
  </template>
</template>
