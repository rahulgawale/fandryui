<template>
  <fandry-dialog
    class="dialog"
    open={open}
    aria-label={dialogLabel}
    exportparts="backdrop, panel"
    ontoggle={handleDialogToggle}
    onkeydown={handleKeydown}
  >
    <template lwc:if={hasOpened}>
      <div class="viewer" part="base">
        <div class="toolbar" part="toolbar">
          <div class="status" part="status">
            <fandry-text as="span" size="sm" variant="muted">{positionText}</fandry-text>
          </div>
          <!--
            What a screen reader hears on moving: where it is and what it shows,
            which the "3 of 12" above doesn't say. A plain box: fandry-text's host
            has no box of its own to announce from.
          -->
          <div class="visually-hidden" aria-live="polite" aria-atomic="true">{announcement}</div>
          <div class="actions">
            <fandry-button
              class="icon-button keys-button"
              variant="ghost"
              element-props={keysProps}
              exportparts="base: keys-button"
              onclick={handleKeysToggle}
            >
              <fandry-icon size="sm">
                <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="2" y="6" width="20" height="12" rx="2"></rect>
                  <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"></path>
                </svg>
              </fandry-icon>
            </fandry-button>
            <fandry-button
              class="icon-button close"
              variant="ghost"
              element-props={closeProps}
              exportparts="base: close-button"
              onclick={handleClose}
            >
              <fandry-icon size="sm">
                <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                  <path d="M18 6 6 18M6 6l12 12"></path>
                </svg>
              </fandry-icon>
            </fandry-button>
          </div>
        </div>

        <!-- Right after its button, so a screen reader reaches it next. The English list is the fallback. -->
        <div class="keys" part="keys" hidden={keysHidden}>
          <slot name="keys"><fandry-media-keys></fandry-media-keys></slot>
        </div>

        <div class="body">
          <div
            class="stage"
            part="stage"
            lwc:ref="stage"
            onpointerdown={handlePointerDown}
            onpointermove={handlePointerMove}
            onpointerup={handlePointerUp}
            onpointercancel={handlePointerCancel}
            onwheel={handleWheel}
          >
            <div class={trackClass} style={trackStyle}>
              <template for:each={slideViews} for:item="slide">
                <div key={slide.key} class={slide.className} aria-hidden={slide.ariaHidden}>
                  <img
                    class={slide.mediaClass}
                    part="image"
                    style={slide.mediaStyle}
                    data-current={slide.isCurrent}
                    src={slide.item.src}
                    srcset={slide.item.srcset}
                    sizes={slide.item.sizes}
                    alt={slide.item.alt}
                    width={slide.item.width}
                    height={slide.item.height}
                    decoding="async"
                    draggable="false"
                  />
                </div>
              </template>
            </div>
          </div>

          <fandry-button
            class="icon-button nav nav--previous"
            variant="secondary"
            element-props={previousProps}
            hidden={isSingle}
            exportparts="base: previous, disabled"
            onclick={handlePrevious}
          >
            <fandry-icon size="sm">
              <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m15 18-6-6 6-6"></path>
              </svg>
            </fandry-icon>
          </fandry-button>
          <fandry-button
            class="icon-button nav nav--next"
            variant="secondary"
            element-props={nextProps}
            hidden={isSingle}
            exportparts="base: next, disabled"
            onclick={handleNext}
          >
            <fandry-icon size="sm">
              <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m9 18 6-6-6-6"></path>
              </svg>
            </fandry-icon>
          </fandry-button>
        </div>

        <fandry-text class="caption" size="sm" variant="muted" exportparts="base: caption" hidden={noCaption}>{caption}</fandry-text>
      </div>
    </template>
  </fandry-dialog>
</template>
