<template>
  <div class="keys" part="base">
    <fandry-text class="title" size="sm">Keyboard shortcuts</fandry-text>
    <dl class="list">
      <div class="row">
        <dt><kbd>←</kbd> <kbd>→</kbd></dt>
        <dd><fandry-text as="span" size="sm" variant="muted">Previous or next picture</fandry-text></dd>
      </div>
      <div class="row">
        <dt><kbd>Home</kbd> <kbd>End</kbd></dt>
        <dd><fandry-text as="span" size="sm" variant="muted">First or last picture</fandry-text></dd>
      </div>
      <div class="row">
        <dt><kbd>+</kbd> <kbd>−</kbd></dt>
        <dd><fandry-text as="span" size="sm" variant="muted">Zoom in or out</fandry-text></dd>
      </div>
      <div class="row">
        <dt><kbd>0</kbd></dt>
        <dd><fandry-text as="span" size="sm" variant="muted">Reset zoom</fandry-text></dd>
      </div>
      <div class="row">
        <dt><kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd></dt>
        <dd><fandry-text as="span" size="sm" variant="muted">Look around a zoomed picture</fandry-text></dd>
      </div>
      <div class="row">
        <dt><kbd>Page Up</kbd> <kbd>Page Down</kbd></dt>
        <dd><fandry-text as="span" size="sm" variant="muted">Previous or next picture, also while zoomed</fandry-text></dd>
      </div>
      <div class="row">
        <dt><kbd>?</kbd></dt>
        <dd><fandry-text as="span" size="sm" variant="muted">Show or hide this list</fandry-text></dd>
      </div>
      <div class="row">
        <dt><kbd>Esc</kbd></dt>
        <dd><fandry-text as="span" size="sm" variant="muted">Close</fandry-text></dd>
      </div>
    </dl>
  </div>
</template>
