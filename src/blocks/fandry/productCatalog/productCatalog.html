<template>
  <div class="catalog">
    <aside class="filters" aria-label="Filters">
      <fandry-input
        type="search"
        label="Search"
        placeholder="Search products"
        value={query}
        oninput={handleQueryInput}
      ></fandry-input>

      <fandry-select
        label="Category"
        value={category}
        options={categoryOptions}
        onchange={handleCategoryChange}
      ></fandry-select>

      <template if:true={hasColorOptions}>
        <div class="group" role="group" aria-labelledby="color-label">
          <span class="group-label" id="color-label">Color</span>
          <div class="colors">
            <template for:each={colorOptions} for:item="color">
              <button
                key={color.name}
                type="button"
                class={color.classes}
                aria-pressed={color.ariaPressed}
                data-name={color.name}
                tabindex="0"
                onclick={handleColorClick}
              >
                <span class="dot" style={color.style}></span>
                {color.name}
              </button>
            </template>
          </div>
        </div>
      </template>

      <div class="group" role="group" aria-labelledby="price-label">
        <span class="group-label" id="price-label">Price</span>
        <div class="price-range">
          <fandry-input
            type="number"
            placeholder="Min"
            value={minPrice}
            element-props={minPriceProps}
            oninput={handleMinPriceInput}
          ></fandry-input>
          <fandry-input
            type="number"
            placeholder="Max"
            value={maxPrice}
            element-props={maxPriceProps}
            oninput={handleMaxPriceInput}
          ></fandry-input>
        </div>
      </div>

      <fandry-switch label="On sale" checked={onSale} onchange={handleOnSaleChange}></fandry-switch>

      <template if:true={hasActiveFilters}>
        <fandry-button variant="ghost" class="clear" onclick={handleClearFilters}>Clear filters</fandry-button>
      </template>
    </aside>

    <section class="results" aria-label="Products">
      <div class="toolbar">
        <p class="count" role="status">{resultLabel}</p>
        <fandry-select
          class="sort"
          label="Sort by"
          value={sort}
          options={sortOptions}
          onchange={handleSortChange}
        ></fandry-select>
      </div>

      <template if:true={hasResults}>
        <ul class="grid">
          <template for:each={items} for:item="item">
            <li key={item.key} class="item">
              <fandry-product-card
                product={item.product}
                swatch={item.swatch}
                currency={currency}
                onaddtocart={handleAddToCart}
              ></fandry-product-card>
            </li>
          </template>
        </ul>
      </template>

      <template if:false={hasResults}>
        <div class="empty">
          <p class="empty-title">No products match these filters.</p>
          <fandry-button variant="secondary" onclick={handleClearFilters}>Clear filters</fandry-button>
        </div>
      </template>
    </section>
  </div>
</template>
