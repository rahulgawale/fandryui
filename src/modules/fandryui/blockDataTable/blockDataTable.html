<template>
  <fandryui-site-header></fandryui-site-header>

  <main class="page">
    <fandry-breadcrumb>
      <fandry-breadcrumb-item href="/">Home</fandry-breadcrumb-item>
      <fandry-breadcrumb-item href="/blocks">Blocks</fandry-breadcrumb-item>
      <fandry-breadcrumb-item current>Data table</fandry-breadcrumb-item>
    </fandry-breadcrumb>

    <fandry-badge class="kind">Block</fandry-badge>
    <fandry-heading level="1" class="title">Data table</fandry-heading>
    <fandry-text variant="muted" class="lede">
      Search, filters, column visibility, pagination, selection, row actions, inline and multi-record editing and save hooks with toasts, all
      built from fandry-* primitives. It is a working screen, not a screenshot: everything below runs
      against a fake backend with real latency and real validation.
    </fandry-text>

    <section class="section">
      <div class="demo-controls">
        <fandry-switch
          label="Simulate server errors"
          checked={simulateErrors}
          onchange={handleSimulateErrorsChange}
        ></fandry-switch>
        <fandry-switch
          label="Simulate latency"
          checked={simulateLatency}
          onchange={handleSimulateLatencyChange}
        ></fandry-switch>
        <fandry-text size="sm" variant="muted">
          Try it: choose <strong>Edit</strong> from a row's menu (or double-click a cell), clear the name or enter
          an email without an @, then Save. Select two or more rows for <strong>Edit selected</strong>.
        </fandry-text>
      </div>

      <fandry-card class="demo-frame">
        <fandry-data-table
          columns={columns}
          data={rows}
          loading={loading}
          page-size={pageSize}
          loading-row-count="8"
          caption="People"
          get-row-label={getRowLabel}
          save-row={saveRow}
          save-rows={saveRows}
          delete-row={deleteRow}
          onrowsave={handleRowSave}
          onrowdelete={handleRowDelete}
          onrowselectionchange={handleSelectionChange}
        >
          <fandry-button slot="toolbar" variant="secondary" size="sm" disabled={loading} onclick={handleRefresh}>
            Refresh
          </fandry-button>
          <fandry-button slot="toolbar" size="sm" disabled={noSelection} onclick={handleBulkDelete}>
            {bulkDeleteLabel}
          </fandry-button>
        </fandry-data-table>
      </fandry-card>
    </section>

    <section class="section">
      <fandry-heading level="3">Install</fandry-heading>
      <div class="two-up">
        <div>
          <fandry-text size="sm" variant="muted" class="label">LWR / LWC OSS</fandry-text>
          <pre class="code-block"><code>{installNpm}</code></pre>
        </div>
        <div>
          <fandry-text size="sm" variant="muted" class="label">Salesforce DX</fandry-text>
          <pre class="code-block"><code>{installSfdx}</code></pre>
        </div>
      </div>
    </section>

    <section class="section">
      <fandry-heading level="3">Usage</fandry-heading>
      <pre class="code-block"><code>{usageCode}</code></pre>
      <fandry-text size="sm" variant="muted" class="note">
        A column is a plain tanstack column definition. What makes it filterable, editable or badged is its <code>meta</code>:
      </fandry-text>
      <pre class="code-block"><code>{columnsCode}</code></pre>
      <fandry-text size="sm" variant="muted" class="note">
        The block owns the workflow (saving state, toasts, failure handling); you own the request and the data:
      </fandry-text>
      <pre class="code-block"><code>{hooksCode}</code></pre>
    </section>

    <section class="section">
      <fandry-heading level="3">Props</fandry-heading>
      <div class="table-wrap">
        <table class="doc-table">
          <thead>
            <tr><th>Prop</th><th>Type</th><th>Default</th><th>Description</th></tr>
          </thead>
          <tbody>
            <template for:each={props} for:item="prop">
              <tr key={prop.name}>
                <td><code>{prop.name}</code></td>
                <td><code>{prop.type}</code></td>
                <td><code>{prop.default}</code></td>
                <td>{prop.description}</td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>

    <section class="section">
      <fandry-heading level="3">Events</fandry-heading>
      <div class="table-wrap">
        <table class="doc-table">
          <thead>
            <tr><th>Event</th><th>detail</th><th>Description</th></tr>
          </thead>
          <tbody>
            <template for:each={events} for:item="event">
              <tr key={event.name}>
                <td><code>{event.name}</code></td>
                <td><code>{event.detail}</code></td>
                <td>{event.description}</td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>

    <section class="section">
      <fandry-heading level="3">Slots</fandry-heading>
      <div class="table-wrap">
        <table class="doc-table">
          <thead>
            <tr><th>Slot</th><th>Description</th></tr>
          </thead>
          <tbody>
            <template for:each={slots} for:item="slot">
              <tr key={slot.name}>
                <td><code>{slot.name}</code></td>
                <td>{slot.description}</td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>

    <section class="section">
      <fandry-heading level="3">Make it yours</fandry-heading>
      <fandry-text variant="muted">
        The block is two files on purpose. <code>fandry/dataTableState</code> has all the behavior and no template; <code>fandry/dataTable</code> is that class plus the markup you see here. To change the markup, extend the state class and write your own template, or, on Salesforce, just edit the copy <code>fandry add</code> put in your project. Built from:
        <template for:each={builtFrom} for:item="name">
          <fandry-badge key={name} class="chip">{name}</fandry-badge>
        </template>
      </fandry-text>
    </section>
  </main>

  <fandryui-site-footer></fandryui-site-footer>
</template>
