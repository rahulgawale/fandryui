<template>
  <div class="custom-table">
    <div class="custom-table__toolbar">
      <template for:each={headerGroup.headers} for:item="header">
        <button
          key={header.id}
          type="button"
          class="custom-table__sort-button"
          data-column-id={header.columnId}
          onclick={handleHeaderClick}
        >
          {header.label} {header.sortIndicator}
        </button>
      </template>
    </div>
    <div class="custom-table__grid">
      <template for:each={rows} for:item="row">
        <div key={row.id} class="custom-table__card">
          <template for:each={row.cells} for:item="cell">
            <div key={cell.id} class="custom-table__cell">{cell.value}</div>
          </template>
        </div>
      </template>
    </div>
  </div>
</template>
