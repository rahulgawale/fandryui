<template>
  <div class="product-gallery">
    <div class="stage">
      <!-- data-index: where FdMediaGalleryState puts focus back after the viewer. -->
      <fandry-button class="main" variant="ghost" data-index={currentIndex} element-props={mainProps} onclick={handleSelect}>
        <img class="main-image" src={main.src} alt="" width={main.width} height={main.height} />
      </fandry-button>
      <fandry-button class="arrow arrow--previous" variant="secondary" element-props={previousProps} onclick={handlePrevious}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </fandry-button>
      <fandry-button class="arrow arrow--next" variant="secondary" element-props={nextProps} onclick={handleNext}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
      </fandry-button>
    </div>

    <ul class="thumbs">
      <template for:each={thumbs} for:item="thumb">
        <li key={thumb.key}>
          <fandry-button class={thumb.className} variant="ghost" data-thumb={thumb.index} element-props={thumb.props} onclick={handleThumb}>
            <img src={thumb.src} alt="" loading="lazy" />
          </fandry-button>
        </li>
      </template>
    </ul>

    <fandry-media-viewer
      items={items}
      index={currentIndex}
      open={viewerOpen}
      messages={messages}
      onchange={handleViewerChange}
      ontoggle={handleViewerToggle}
    ></fandry-media-viewer>
  </div>
</template>
