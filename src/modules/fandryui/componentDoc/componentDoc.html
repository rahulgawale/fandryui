<template>
  <fandryui-site-header></fandryui-site-header>

  <div class="layout">
    <fandry-sidebar aria-label="Components" class="nav">
      <template for:each={sidebarGroups} for:item="group">
        <div key={group.category} class="group">
          <fandry-text as="span" size="xs" variant="muted" class="group-label">{group.category}</fandry-text>
          <template for:each={group.items} for:item="item">
            <fandry-sidebar-item key={item.slug} href={item.href} active={item.active}>{item.name}</fandry-sidebar-item>
          </template>
        </div>
      </template>
    </fandry-sidebar>

    <main class="content">
      <template if:true={entry}>
        <fandry-badge>{entry.category}</fandry-badge>
        <fandry-heading level="1" class="title">{entry.name}</fandry-heading>
        <fandry-text variant="muted" class="lede"><fandryui-doc-text text={entry.description}></fandryui-doc-text></fandry-text>
        <fandry-text size="sm" variant="muted" class="tag"><code>{entry.tag}</code></fandry-text>

        <section class="section">
          <fandryui-doc-heading level="2" text="Example" class="section-title"></fandryui-doc-heading>
          <fandry-card class="demo-frame">
            <lwc:component lwc:is={demoComponent}></lwc:component>
          </fandry-card>
        </section>

        <template if:true={customizeDemo}>
          <section class="section">
            <fandryui-doc-heading level="2" text="Custom colors and parts" anchor="customize" class="section-title"></fandryui-doc-heading>
            <fandry-text variant="muted" size="sm" class="section-note">
              The same component with a few <code>--fd-*</code> tokens set around it and its parts restyled. The code is
              under Parts below.
            </fandry-text>
            <fandry-card class="demo-frame">
              <lwc:component lwc:is={customizeDemo}></lwc:component>
            </fandry-card>
          </section>
        </template>

        <section class="section">
          <fandryui-doc-heading level="2" text="Props" class="section-title"></fandryui-doc-heading>
          <template if:true={hasProps}>
            <div class="props-table-wrap">
              <table class="props-table">
                <thead>
                  <tr>
                    <th>Prop</th>
                    <th>Type</th>
                    <th>Default</th>
                    <th>Description</th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={entry.props} for:item="prop">
                    <tr key={prop.name}>
                      <td><code>{prop.name}</code></td>
                      <td><code>{prop.type}</code></td>
                      <td><code>{prop.default}</code></td>
                      <td><fandryui-doc-text text={prop.description}></fandryui-doc-text></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>
          <template if:false={hasProps}>
            <fandry-text variant="muted" size="sm">
              This component has no configurable props — compose it via slots.
            </fandry-text>
          </template>
        </section>

        <template if:true={hasParts}>
          <section class="section">
            <fandryui-doc-heading level="2" text="Parts" class="section-title"></fandryui-doc-heading>
            <fandry-text variant="muted" size="sm" class="section-note">
              Style the elements inside the component from your own CSS with <code>::part()</code>. Every fandry
              component renders in native shadow DOM, so parts work on LWR and Salesforce alike. For colors, spacing,
              radius and type across many components, set the <code>--fd-*</code> tokens instead. The code for the
              "Custom colors and parts" example above:
            </fandry-text>
            <div class="props-table-wrap">
              <table class="props-table">
                <thead>
                  <tr>
                    <th>Part</th>
                    <th>Description</th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={parts} for:item="part">
                    <tr key={part.name}>
                      <td><code>{part.name}</code></td>
                      <td><fandryui-doc-text text={part.description}></fandryui-doc-text></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
            <template if:true={hasStates}>
              <fandry-text variant="muted" size="sm" class="section-note states-note">
                States are extra names on a part while the state is on. Name both to style one state, e.g.
                <code>fandry-checkbox::part(control checked)</code>.
              </fandry-text>
              <div class="props-table-wrap">
                <table class="props-table">
                  <thead>
                    <tr>
                      <th>State</th>
                      <th>Description</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template for:each={states} for:item="state">
                      <tr key={state.name}>
                        <td><code>{state.name}</code></td>
                        <td><fandryui-doc-text text={state.description}></fandryui-doc-text></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>
            <template if:true={customizeCode}>
              <fandryui-code-block code={customizeCode} class="parts-code"></fandryui-code-block>
            </template>
          </section>
        </template>

        <section class="section">
          <fandryui-doc-heading level="2" text="Code" class="section-title"></fandryui-doc-heading>
          <fandryui-code-block code={entry.code}></fandryui-code-block>
        </section>

        <template for:each={notes} for:item="note">
          <section key={note.title} class="section">
            <fandry-alert variant="info" title={note.title}>
              <template for:each={note.paragraphs} for:item="paragraph">
                <fandry-text key={paragraph.key} size="sm" class="note-paragraph"><fandryui-doc-text text={paragraph.text}></fandryui-doc-text></fandry-text>
              </template>
            </fandry-alert>
          </section>
        </template>

        <template for:each={extraExamples} for:item="example">
          <div key={example.title}>
            <section class="section">
              <fandryui-doc-heading level="2" text={example.heading} anchor={example.anchor} class="section-title"></fandryui-doc-heading>
              <fandry-card class="demo-frame">
                <lwc:component lwc:is={example.demoComponent}></lwc:component>
              </fandry-card>
            </section>

            <section class="section">
              <fandry-text size="sm" variant="muted" class="code-caption">Code</fandry-text>
              <fandryui-code-block code={example.code}></fandryui-code-block>
            </section>
          </div>
        </template>

        <fandry-pagination
          previous-href={previousHref}
          previous-label={previousLabel}
          next-href={nextHref}
          next-label={nextLabel}
        ></fandry-pagination>
      </template>

      <template if:false={entry}>
        <fandry-heading level="1">Not found</fandry-heading>
        <fandry-text variant="muted">
          That component doesn't exist. Pick one from the sidebar.
        </fandry-text>
      </template>
    </main>

    <template if:true={entry}>
      <fandryui-doc-toc class="toc" items={tocItems}></fandryui-doc-toc>
    </template>
  </div>

  <fandryui-site-footer></fandryui-site-footer>
</template>
