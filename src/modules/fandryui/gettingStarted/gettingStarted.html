<template>
  <fandryui-site-header></fandryui-site-header>

  <div class="layout">
    <fandry-sidebar aria-label="Getting started" class="nav">
      <div class="group">
        <fandry-text as="span" size="xs" variant="muted" class="group-label">Getting started</fandry-text>
        <template for:each={sidebarItems} for:item="item">
          <fandry-sidebar-item key={item.slug} href={item.href} active={item.active}>{item.name}</fandry-sidebar-item>
        </template>
      </div>
    </fandry-sidebar>

    <main class="content">
      <fandry-badge>{page.badge}</fandry-badge>
      <fandry-heading level="1" class="title">{page.title}</fandry-heading>
      <fandry-text variant="muted" class="lede"><fandryui-doc-text text={page.description}></fandryui-doc-text></fandry-text>

      <template if:true={isOverview}>
        <div class="grid">
          <template for:each={platformCards} for:item="card">
            <a key={card.slug} href={card.href} class="card-link">
              <fandry-card class="card">
                <fandry-badge>{card.badge}</fandry-badge>
                <fandry-heading level="2">{card.name}</fandry-heading>
                <fandry-text variant="muted" size="sm"><fandryui-doc-text text={card.description}></fandryui-doc-text></fandry-text>
              </fandry-card>
            </a>
          </template>
        </div>
      </template>

      <template for:each={sections} for:item="section">
        <section key={section.id} class="section">
          <fandryui-doc-heading level="2" text={section.title} class="section-title"></fandryui-doc-heading>

          <template for:each={section.blocks} for:item="block">
            <div key={block.key} class="block">
              <template if:true={block.isText}>
                <fandry-text><fandryui-doc-text text={block.text}></fandryui-doc-text></fandry-text>
              </template>

              <template if:true={block.isList}>
                <ul class="list">
                  <template for:each={block.items} for:item="item">
                    <li key={item}><fandry-text><fandryui-doc-text text={item}></fandryui-doc-text></fandry-text></li>
                  </template>
                </ul>
              </template>

              <template if:true={block.isCode}>
                <fandryui-code-block label={block.label} code={block.code}></fandryui-code-block>
              </template>

              <template if:true={block.isTree}>
                <fandryui-code-block label={block.label} code={block.code} variant="tree"></fandryui-code-block>
              </template>

              <template if:true={block.isNote}>
                <fandry-alert variant={block.variant} title={block.title}><fandryui-doc-text text={block.text}></fandryui-doc-text></fandry-alert>
              </template>
            </div>
          </template>
        </section>
      </template>

      <fandry-divider class="end-divider"></fandry-divider>
      <fandry-text variant="muted" size="sm">Ready to build? Browse every component, its props and examples under <fandry-link href="/components">Components</fandry-link>.</fandry-text>
    </main>

    <fandryui-doc-toc class="toc" items={tocItems}></fandryui-doc-toc>
  </div>

  <fandryui-site-footer></fandryui-site-footer>
</template>
