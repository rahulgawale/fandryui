        <code>role="paragraph"</code>), the same case those roles exist
        for. fandry-heading sizes off the same token scale as everything
        else; fandry-text's <code>as</code> (p/span/div, default p) picks
        block vs. inline layout and, for "p", the paragraph role.

    <section>
      <h2>Toast Example</h2>
      <p>
        fandry-toast starts its own auto-dismiss timer on mount and plays an
        exit animation before notifying the consumer via
        <code>ondismiss</code>. It owns no queue of its own -- appending a
        new toast and removing a dismissed one from the list is ordinary
        application-layer state (see <code>handleToastDismiss</code> in
        app.ts). fandry-toast-viewport is the other half: a fixed-position,
        four-corner stacking region a consumer places once and slots every
        fandry-toast into, the same "one primitive owns positioning, another
        owns the message" split as fandry-popover's trigger/panel.
      </p>
      <p>
        fandry-toast's default slot itself has no restriction on rich content
        -- the "Show rich toast" button below shows a toast whose body is
        a real component (toastBody, with a title/detail/action) instead
        of a plain string. A <code>for:each</code>-driven queue like this
        one's own <code>toasts</code> array can only bind
        <code>toast.message</code> as plain escaped text, though, so per
        -item rich content there needs the same
        <code>component</code>/<code>componentProps</code> +
        <code>lwc:is</code> composition fandry-select's own
        <code>planOptionsWithIcons</code> demo already uses -- see
        <code>handleAddRichToast</code> in app.ts.
      </p>

        <fandry-button variant="secondary" onclick={handleAddWarningToast}>

        <fandry-button variant="secondary" onclick={handleAddDangerToast}>
          Show danger toast
        </fandry-button>
        <fandry-button variant="secondary" onclick={handleAddRichToast}>
          Show rich toast
        </fandry-button>
      </div>
      <fandry-toast-viewport placement="bottom-right" label="Notifications">
        <template for:each={toasts} for:item="toast">
          <fandry-toast
            key={toast.id}
            data-id={toast.id}
            variant={toast.variant}
            duration="4000"
            ondismiss={handleToastDismiss}
            onaction={handleToastAction}
          >
            <template if:true={toast.component}>
              <lwc:component lwc:is={toast.component} lwc:spread={toast.componentProps}></lwc:component>
            </template>
            <template if:false={toast.component}>{toast.message}</template>
          </fandry-toast>
        </template>
      </fandry-toast-viewport>

      <fandry-heading level="3" style="margin-top: var(--fd-space-5);">

      <p>
        <code>contained</code> switches fandry-toast-viewport from
        <code>position: fixed</code> (pinned to the browser viewport, the
        example above) to <code>position: absolute</code>, scoped to
        whatever positioned ancestor a consumer wraps it in -- here, the
        bordered panel below instead of the whole page. The panel below
        has <code>overflow: hidden</code>, so a toast staying visible
        inside it (rather than escaping to the page's own corner) is what
        proves it's actually scoped, not just visually coincidental.
      </p>
      <div class="panel-demo">
