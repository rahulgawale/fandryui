<template>
  <main>
    <h1>Fandry UI – LWR OSS</h1>

    <section class="intro">
      <h2>Mission</h2>
      <p>
        Fandry UI is a Lightning Web Components (LWC) library optimized for
        <strong> longevity, clarity, and discipline</strong>, not velocity or
        novelty.
      </p>
      <p>
        We provide small, boring, and predictable primitives that are extensible
        via slots and composition. Every component is built with native LWC,
        uses design tokens consistently, and avoids business logic or hard-coded
        values.
      </p>
      <p>
        This is a <strong>component library</strong>, not a production
        application. Architecture and maintainability come first.
      </p>
      <p>
        <strong>Contribute: </strong>
        <a
          href="https://github.com/rahulgawale/fandryui"
          target="_blank"
          rel="noopener noreferrer"
        >
          github.com/rahulgawale/fandryui
        </a>
      </p>
    </section>

    <section>
      <h2>Component Primitives</h2>
      <p>
        Demonstrating fd-input, fd-textarea, fd-button, fd-checkbox, fd-radio,
        fd-select, fd-switch, fd-label, fd-badge, fd-card, fd-alert, fd-spinner,
        fd-divider, fd-skeleton, fd-avatar, and fd-popover primitives
      </p>
    </section>

    <section>
      <h2>Application Components</h2>
      <p>
        Built on top of the primitives above. fd-table wraps
        <code>@tanstack/table-core</code> for headless row/column/sorting logic,
        while rendering stays native LWC.
      </p>
    </section>

    <section>
      <h2>Button Examples</h2>
      <div
        style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: center"
      >
        <fd-button>Primary Button</fd-button>
        <fd-button variant="secondary">Secondary</fd-button>
        <fd-button variant="ghost">Ghost</fd-button>
        <fd-button disabled>Disabled</fd-button>
      </div>
      <div
        style="
          display: flex;
          gap: 1rem;
          flex-wrap: wrap;
          align-items: center;
          margin-top: 0.75rem;
        "
      >
        <fd-button size="sm">Small</fd-button>
        <fd-button size="md">Medium</fd-button>
        <fd-button size="lg">Large</fd-button>
      </div>
    </section>

    <section>
      <h2>Avatar Example</h2>
      <div
        style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap"
      >
        <fd-avatar initials="JD" size="sm"></fd-avatar>
        <fd-avatar initials="JD" size="md"></fd-avatar>
        <fd-avatar initials="JD" size="lg"></fd-avatar>
        <fd-avatar
          src="https://broken.example/does-not-exist.jpg"
          initials="RG"
          alt="Rahul Gawale"
        ></fd-avatar>
      </div>
    </section>

    <section>
      <h2>Spinner Example</h2>
      <div
        style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap"
      >
        <fd-spinner size="sm"></fd-spinner>
        <fd-spinner size="md"></fd-spinner>
        <fd-spinner size="lg"></fd-spinner>
        <fd-button variant="secondary" disabled>
          <fd-spinner size="sm"></fd-spinner>
          Saving…
        </fd-button>
      </div>
    </section>

    <section>
      <h2>Skeleton Example</h2>
      <fd-card>
        <div style="display: flex; gap: 0.75rem; align-items: flex-start">
          <fd-skeleton variant="circle"></fd-skeleton>
          <div
            style="flex: 1; display: flex; flex-direction: column; gap: 0.5rem"
          >
            <fd-skeleton variant="text" style="width: 40%"></fd-skeleton>
            <fd-skeleton variant="text"></fd-skeleton>
            <fd-skeleton variant="rect"></fd-skeleton>
          </div>
        </div>
      </fd-card>
    </section>

    <section>
      <h2>Divider Example</h2>
      <p>Above</p>
      <fd-divider></fd-divider>
      <p>Below</p>
      <div
        style="display: flex; align-items: center; gap: 0.75rem; height: 2rem"
      >
        <span>Left</span>
        <fd-divider orientation="vertical"></fd-divider>
        <span>Right</span>
      </div>
    </section>

    <section>
      <h2>Popover Example</h2>
      <div
        style="
          display: flex;
          gap: 1rem;
          flex-wrap: wrap;
          align-items: flex-start;
        "
      >
        <fd-popover placement="bottom">
          <fd-button slot="trigger" variant="secondary">Bottom</fd-button>
          <div style="width: 12rem">
            <p style="margin: 0 0 0.5rem">
              Popover content anchored below the trigger.
            </p>
            <fd-button size="sm">Action</fd-button>
          </div>
        </fd-popover>

        <fd-popover placement="top">
          <fd-button slot="trigger" variant="secondary">Top</fd-button>
          <div style="width: 10rem">Anchored above.</div>
        </fd-popover>

        <fd-popover placement="right">
          <fd-button slot="trigger" variant="secondary">Right</fd-button>
          <div style="width: 10rem">Anchored to the right.</div>
        </fd-popover>

        <fd-popover placement="bottom">
          <fd-button slot="trigger" variant="ghost">Menu</fd-button>
          <div style="display: flex; flex-direction: column; min-width: 8rem">
            <fd-button variant="ghost" size="sm">Edit</fd-button>
            <fd-button variant="ghost" size="sm">Duplicate</fd-button>
            <fd-button variant="ghost" size="sm">Delete</fd-button>
          </div>
        </fd-popover>
      </div>
    </section>

    <section>
      <h2>Link Example</h2>
      <div style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: center">
        <fd-link href="https://github.com/rahulgawale/fandryui" target="_blank">Default link</fd-link>
        <fd-link href="https://github.com/rahulgawale/fandryui" variant="muted" target="_blank">Muted link</fd-link>
        <fd-link href="https://github.com/rahulgawale/fandryui" disabled>Disabled link</fd-link>
      </div>
    </section>

    <section>
      <h2>Menu Example</h2>
      <p>
        fd-menu wraps no trigger and owns no open state of its own -- it
        composes with fd-popover the same way any two fd-* primitives do,
        with this component (the consumer) wiring <code>open</code>/<code
          >ontoggle</code
        >
        and closing the menu from its own <code>onselect</code> handler.
      </p>
      <div style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-start">
        <fd-popover open={menuOpen} ontoggle={handleMenuToggle} placement="bottom">
          <fd-button
            slot="trigger"
            variant="secondary"
            element-props={menuTriggerProps}
          >Actions</fd-button>
          <fd-menu onselect={handleMenuSelect}>
            <fd-menu-item value="edit" label="Edit"></fd-menu-item>
            <fd-menu-item value="duplicate" label="Duplicate"></fd-menu-item>
            <fd-menu-item value="delete" label="Delete" disabled></fd-menu-item>
          </fd-menu>
        </fd-popover>
        <span if:true={lastMenuSelection}>Last selected: {lastMenuSelection}</span>
      </div>
    </section>

    <section>
      <h2>Input Example</h2>
      <fd-input label="Email" type="email">
        <span slot="leading">📧</span>
        <span slot="help">Used only for login</span>
      </fd-input>
      <div
        style="
          display: flex;
          flex-direction: column;
          gap: 0.5rem;
          margin-top: 0.75rem;
        "
      >
        <fd-input label="Small" size="sm" placeholder="Small input"></fd-input>
        <fd-input
          label="Medium"
          size="md"
          placeholder="Medium input"
        ></fd-input>
        <fd-input label="Large" size="lg" placeholder="Large input"></fd-input>
      </div>
    </section>

    <section>
      <h2>Textarea Example</h2>
      <fd-textarea label="Notes">
        <button slot="trailing">Clear</button>
      </fd-textarea>
    </section>

    <section>
      <h2>Checkbox Example</h2>
      <fd-checkbox label="Accept terms and conditions"></fd-checkbox>
    </section>

    <section>
      <h2>Radio Example</h2>
      <fd-radio-group name="plan" value="pro" label="Choose a plan">
        <fd-radio name="plan" value="free" label="Free Plan"></fd-radio>
        <fd-radio name="plan" value="pro" label="Pro Plan" checked></fd-radio>
        <fd-radio
          name="plan"
          value="enterprise"
          label="Enterprise Plan"
        ></fd-radio>
      </fd-radio-group>
    </section>

    <section>
      <h2>Select Example</h2>
      <fd-select
        label="Plan"
        placeholder="Choose a plan"
        options={planOptions}
        groups={planOptionGroups}
        value="pro"
      ></fd-select>

      <p style="margin-top: 1rem">
        Expandable via <code>lwc:is</code> -- each option can render a custom
        component instead of plain text, and the selected one mirrors into the
        trigger too:
      </p>
      <fd-select
        label="Plan (with icons)"
        placeholder="Choose a plan"
        options={planOptionsWithIcons}
        value="pro"
      ></fd-select>
    </section>

    <section>
      <h2>Label Example</h2>
      <div style="display: flex; flex-direction: column; gap: 1rem">
        <div style="display: flex; flex-direction: column; gap: 0.25rem">
          <fd-label html-for="username">Username</fd-label>
          <input
            id="username"
            type="text"
            class="demo-input"
            placeholder="Enter username"
          />
        </div>
        <div style="display: flex; flex-direction: column; gap: 0.25rem">
          <fd-label html-for="password" required>Password</fd-label>
          <input
            id="password"
            type="password"
            class="demo-input"
            placeholder="Enter password"
          />
        </div>
      </div>
    </section>

    <section>
      <h2>Badge Example</h2>
      <div style="display: flex; gap: 0.5rem; flex-wrap: wrap">
        <fd-badge>Default</fd-badge>
        <fd-badge variant="primary">Primary</fd-badge>
        <fd-badge variant="success">Success</fd-badge>
        <fd-badge variant="warning">Warning</fd-badge>
        <fd-badge variant="danger">Danger</fd-badge>
      </div>
    </section>

    <section>
      <h2>Card Example</h2>
      <fd-card>
        <h3 style="margin: 0 0 0.5rem">Pro Plan</h3>
        <p style="margin: 0 0 0.75rem">
          Everything in Free, plus priority support.
        </p>
        <fd-badge variant="primary">Popular</fd-badge>
      </fd-card>
    </section>

    <section>
      <h2>Alert Example</h2>
      <div style="display: flex; flex-direction: column; gap: 0.75rem">
        <fd-alert>An update is available.</fd-alert>
        <fd-alert variant="success" title="Saved">
          Your changes have been saved.
        </fd-alert>
        <fd-alert variant="warning" title="Heads up">
          Your session will expire in 5 minutes.
        </fd-alert>
        <fd-alert variant="danger" title="Something went wrong">
          Could not save your changes. Please try again.
        </fd-alert>
      </div>
    </section>

    <section>
      <h2>Switch Example</h2>
      <fd-switch label="Enable notifications" checked></fd-switch>
    </section>

    <section>
      <h2>Table Example</h2>
      <fd-switch
        label="Simulate loading"
        checked={tableLoading}
        onchange={handleTableLoadingToggle}
      ></fd-switch>
      <fd-table
        columns={tableColumns}
        data={tableData}
        caption="Team members"
        clickable-rows
        enable-pagination
        page-size={tablePageSize}
        loading={tableLoading}
        enable-row-selection
        enable-global-filter
        onrowclick={handleTableRowClick}
        onpagechange={handleTablePageChange}
        onrowselectionchange={handleTableRowSelectionChange}
      >
        <span slot="empty">No team members yet.</span>
      </fd-table>
    </section>

    <section>
      <h2>Custom Table Example (overriding fd-table)</h2>
      <p>
        fandryui-custom-table doesn't use fd-table at all -- it extends
        fd/tableState directly and renders a CSS Grid instead of a
        &lt;table&gt;, with plain buttons (aligned to the grid's columns)
        instead of clickable &lt;th&gt;s. Sorting still works: it's the exact
        same headless state/handlers fd-table uses, just rendered completely
        differently. Uses the same <code>tableColumns</code>/<code
          >tableData</code
        >
        as the example above.
      </p>
      <fandryui-custom-table
        columns={tableColumns}
        data={tableData}
      ></fandryui-custom-table>
    </section>
  </main>
</template>
