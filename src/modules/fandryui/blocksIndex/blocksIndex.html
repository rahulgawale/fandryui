<template>
  <fandryui-site-header></fandryui-site-header>

  <main class="page">
    <fandry-heading level="1">Blocks</fandry-heading>
    <fandry-text variant="muted" class="lede">
      Working pages and patterns built from fandry-* primitives. Each one is live on its page, and installs
      into your project with the same command as any component.
    </fandry-text>

    <div class="grid">
      <template for:each={blocks} for:item="block">
        <a key={block.slug} href={block.href} class="card-link">
          <fandry-card class="card">
            <fandry-heading level="3">{block.name}</fandry-heading>
            <fandry-text variant="muted" size="sm">{block.description}</fandry-text>
            <div class="chips">
              <template for:each={block.includes} for:item="item">
                <fandry-badge key={item}>{item}</fandry-badge>
              </template>
            </div>
          </fandry-card>
        </a>
      </template>
    </div>
  </main>

  <fandryui-site-footer></fandryui-site-footer>
</template>
