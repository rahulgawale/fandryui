<template>
  <fandryui-site-header></fandryui-site-header>

  <main class="page">
    <fandry-breadcrumb>
      <fandry-breadcrumb-item href="/">Home</fandry-breadcrumb-item>
      <fandry-breadcrumb-item href="/blocks">Blocks</fandry-breadcrumb-item>
      <fandry-breadcrumb-item current>Media gallery</fandry-breadcrumb-item>
    </fandry-breadcrumb>

    <fandry-badge class="kind">Block</fandry-badge>
    <fandry-heading level="1" class="title">Media gallery</fandry-heading>
    <fandry-text variant="muted" class="lede">
      A grid of pictures that fits whatever box it is in, and a full-screen viewer with swipe, pinch to zoom and
      keyboard control. Three pieces you can use apart: the behavior with no markup, a grid, and a viewer. Choose a
      picture to open it.
    </fandry-text>

    <section class="section">
      <div class="demo-controls">
        <fandry-select label="Columns" options={columnOptions} value={columns} onchange={handleColumns}></fandry-select>
        <fandry-select label="Aspect ratio" options={ratioOptions} value={ratio} onchange={handleRatio}></fandry-select>
        <fandry-select label="Fit" options={fitOptions} value={fit} onchange={handleFit}></fandry-select>
        <fandry-select label="Gap" options={gapOptions} value={gap} onchange={handleGap}></fandry-select>
        <fandry-button variant="secondary" onclick={handleReload}>Reload</fandry-button>
      </div>

      <fandry-card class="demo-frame demo-frame--wide">
        <fandry-media-gallery
          items={photos}
          loading={loading}
          loading-count="12"
          style={galleryStyle}
          onchange={handleChange}
        ></fandry-media-gallery>
      </fandry-card>
      <fandry-text size="sm" variant="muted" class="note">
        Last <code>change</code>: {current}. In the viewer: ← → Home End to move, + − 0 to zoom, Esc to close. On a
        phone: swipe, pinch, double tap.
      </fandry-text>
      <pre class="code-block"><code>{themeCode}</code></pre>
    </section>

    <section class="section">
      <fandry-heading level="3">Install</fandry-heading>
      <div class="two-up">
        <div>
          <fandry-text size="sm" variant="muted" class="label">LWR / LWC OSS</fandry-text>
          <pre class="code-block"><code>{installNpm}</code></pre>
        </div>
        <div>
          <fandry-text size="sm" variant="muted" class="label">Salesforce DX</fandry-text>
          <pre class="code-block"><code>{installSfdx}</code></pre>
        </div>
      </div>
    </section>

    <section class="section">
      <fandry-heading level="3">Usage</fandry-heading>
      <pre class="code-block"><code>{usageCode}</code></pre>
      <fandry-text size="sm" variant="muted" class="note">An item is plain data:</fandry-text>
      <pre class="code-block"><code>{itemsCode}</code></pre>
    </section>

    <section class="section">
      <fandry-heading level="3">Props and methods</fandry-heading>
      <div class="table-wrap">
        <table class="doc-table">
          <thead>
            <tr><th>Prop</th><th>Type</th><th>Default</th><th>Description</th></tr>
          </thead>
          <tbody>
            <template for:each={props} for:item="prop">
              <tr key={prop.name}>
                <td><code>{prop.name}</code></td>
                <td><code>{prop.type}</code></td>
                <td><code>{prop.default}</code></td>
                <td>{prop.description}</td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>

    <section class="section">
      <fandry-heading level="3">Item</fandry-heading>
      <div class="table-wrap">
        <table class="doc-table">
          <thead>
            <tr><th>Key</th><th>Type</th><th>Description</th></tr>
          </thead>
          <tbody>
            <template for:each={itemProps} for:item="prop">
              <tr key={prop.name}>
                <td><code>{prop.name}</code></td>
                <td><code>{prop.type}</code></td>
                <td>{prop.description}</td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>

    <section class="section">
      <fandry-heading level="3">Events</fandry-heading>
      <div class="table-wrap">
        <table class="doc-table">
          <thead>
            <tr><th>Event</th><th>detail</th><th>Description</th></tr>
          </thead>
          <tbody>
            <template for:each={events} for:item="event">
              <tr key={event.name}>
                <td><code>{event.name}</code></td>
                <td><code>{event.detail}</code></td>
                <td>{event.description}</td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>

    <section class="section">
      <fandry-heading level="3">Tokens</fandry-heading>
      <fandry-text size="sm" variant="muted" class="note">
        Layout and look are tokens, not props: set them on <code>:root</code>, on a section, or on one gallery.
      </fandry-text>
      <div class="table-wrap">
        <table class="doc-table">
          <thead>
            <tr><th>Token</th><th>Default</th><th>Description</th></tr>
          </thead>
          <tbody>
            <template for:each={tokens} for:item="token">
              <tr key={token.name}>
                <td><code>{token.name}</code></td>
                <td><code>{token.default}</code></td>
                <td>{token.description}</td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>

    <section class="section">
      <fandry-heading level="3">Parts</fandry-heading>
      <div class="table-wrap">
        <table class="doc-table">
          <thead>
            <tr><th>Part</th><th>Description</th></tr>
          </thead>
          <tbody>
            <template for:each={parts} for:item="part">
              <tr key={part.name}>
                <td><code>{part.name}</code></td>
                <td>{part.description}</td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>

    <section class="section">
      <fandry-heading level="3">Make it yours: a product gallery</fandry-heading>
      <fandry-text variant="muted" class="note">
        A store's product page wants one big picture and a strip of thumbnails, not a grid. This one extends <code>fandry/mediaGalleryState</code> and writes only its own markup: the current picture, focus coming back
        after the viewer, the events and the full-screen viewer with swipe and zoom all come from the block.
      </fandry-text>
      <fandry-card class="demo-frame demo-frame--wide">
        <div class="product">
          <fandryui-product-gallery class="product-media" items={productPhotos}></fandryui-product-gallery>
          <div class="product-info">
            <fandry-text size="sm" variant="muted">Single origin · Whole bean</fandry-text>
            <fandry-heading level="2">House Blend</fandry-heading>
            <fandry-text class="price">₹ 640 · 250 g</fandry-text>
            <fandry-text variant="muted">
              A medium roast with notes of cocoa and toasted almond, roasted every Monday and shipped the same week.
            </fandry-text>
            <fandry-button>Add to cart</fandry-button>
          </div>
        </div>
      </fandry-card>
      <pre class="code-block"><code>{customCode}</code></pre>
    </section>

    <section class="section">
      <fandry-heading level="3">The pieces</fandry-heading>
      <fandry-text variant="muted">
        <code>fandry/mediaGalleryState</code> has the behavior and no template. <code>fandry/mediaGallery</code> is that
        class plus a grid and a viewer. <code>fandry/mediaGrid</code> and <code>fandry/mediaViewer</code> each work on
        their own and know nothing of each other; what they share is the item shape in <code>fandry/mediaItem</code>. <code>fandry/mediaGestures</code> is the swipe and pinch math, with no template. To change the markup, extend
        the state class, or, on Salesforce, edit the copy <code>fandry add</code> put in your project. Built from:
        <template for:each={builtFrom} for:item="name">
          <fandry-badge key={name} class="chip">{name}</fandry-badge>
        </template>
      </fandry-text>
    </section>
  </main>

  <fandryui-site-footer></fandryui-site-footer>
</template>
