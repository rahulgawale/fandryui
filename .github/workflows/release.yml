name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # Same npm as npm-workflow.yml and dependabot; npm 10 rejects their lockfiles.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci

      # The same two checks the npm publish runs. They run here first because
      # a tag and GitHub Release are permanent: failing after semantic-release
      # leaves a version that exists on GitHub but can never reach npm.
      - name: Verify package in an isolated consumer
        run: npm run verify:npm

      - name: Verify the CLI
        run: npm run verify:sfdx

      - name: Build
        run: npm run build

      - name: Release
        env:
          # A PAT (not the default GITHUB_TOKEN) is required so the release
          # commit/tag push can bypass the "Protected Main" ruleset's PR
          # requirement, since github-actions[bot] holds no repository role.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # NPM_TOKEN: ${{ secrets.NPM_TOKEN }} # Uncomment when ready to publish to npm
        run: npx semantic-release

      # Plain-HTML copies of every page for crawlers that don't run
      # JavaScript; see scripts/prerender.mjs. After Release, so a docs-site
      # failure can't hold back a package release.
      - name: Prerender pages
        run: |
          npx playwright install --with-deps --only-shell chromium
          npm run prerender

      - name: Deploy to GitHub Pages
        env:
          # gh-pages branch isn't covered by the "Protected Main" ruleset, so
          # the default GITHUB_TOKEN (with the contents:write permission
          # granted above) is enough to push it -- no PAT needed here.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx gh-pages -d site --nojekyll --cname fandryui.forcetrails.com \
            -u '"github-actions[bot]" <"41898282+github-actions[bot]"@users.noreply.github.com>' \
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
