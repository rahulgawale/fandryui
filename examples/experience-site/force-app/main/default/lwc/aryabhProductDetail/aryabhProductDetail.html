<template>
  <c-fandry-toast-viewport placement="top-right" label="Cart updates">
    <template for:each={toasts} for:item="toast">
      <c-fandry-toast key={toast.id} data-id={toast.id} variant={toast.variant} duration="4000" ondismiss={handleToastDismiss}>
        {toast.message}
      </c-fandry-toast>
    </template>
  </c-fandry-toast-viewport>

  <template lwc:if={loading}>
    <div class="status"><c-fandry-spinner size="lg" label="Loading the product"></c-fandry-spinner></div>
  </template>
  <template lwc:elseif={error}>
    <p class="status" role="alert">{error}</p>
  </template>
  <template lwc:else>
    <template lwc:if={pricingError}>
      <p class="notice" role="status">Prices aren't available right now: {pricingError}</p>
    </template>
    <c-aryabh-product-detail-view
      product={product}
      currency={currency}
      busy={adding}
      onaddtocart={handleAddToCart}
    ></c-aryabh-product-detail-view>
  </template>
</template>
